<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sugar &amp; Sprinkles — Sunny Bakery</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1e5aa8; }
  #game {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: min(100vw, calc(100vh * 1280 / 720));
    height: auto;
    display: block;
    touch-action: none;
    background: #fdf3c4;
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Sugar and Sprinkles, Sunny Bakery: a cheerful bakery game for young cooks. Move with WASD, use stations with Space, serve dishes before the clock runs out"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
